<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login screen -->
  <section id="login-screen" class="screen hidden">
    <div class="login-card">
      <div class="login-logo">T</div>
      <h1>TaskFlow</h1>
      <p class="subtitle">Simple Task Management</p>
      <a href="/auth/google" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>
    </div>
  </section>

  <!-- Dashboard screen -->
  <section id="dashboard-screen" class="screen hidden">
    <header class="topbar">
      <span class="brand">TaskFlow</span>
      <div class="user-info">
        <span id="user-avatar" class="user-avatar"></span>
        <span id="user-name"></span>
        <a href="/auth/logout" class="btn btn-logout">Logout</a>
      </div>
    </header>

    <main class="content">
      <h2>My Tasks</h2>

      <form id="create-task-form" class="create-task-form">
        <input
          type="text"
          id="task-title-input"
          placeholder="Enter task title..."
          autocomplete="off"
        />
        <button type="submit" id="add-task-btn">Add Task</button>
      </form>
      <p id="form-error" class="form-error hidden"></p>

      <hr />

      <div id="tasks-container">
        <p id="empty-state" class="empty-state hidden">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="4" y="3" width="16" height="18" rx="2"/>
            <path d="M8 7h8M8 12h8M8 17h5"/>
          </svg>
          <br />
          You don't have any tasks yet.<br />
          Create your first task above.
        </p>
        <ul id="task-list" class="task-list"></ul>
      </div>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
